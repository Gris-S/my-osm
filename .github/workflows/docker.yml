# Builds the MY OSM Docker image and pushes it to the GitHub Container Registry.
#
# A push to the `docker-test` branch publishes `ghcr.io/gris-s/my-osm:test`,
# the build to check before anything is released. Version tags do **not**
# trigger it yet: the phone releases push `v*` tags, and they must not publish
# a `latest` Docker image that nobody has checked.
#
# Every action is pinned to a full commit SHA: a tag can be moved, a commit
# cannot. The version each SHA stands for is in the comment next to it.
name: Docker image

on:
  push:
    branches: [docker-test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/gris-s/my-osm
          tags: |
            type=raw,value=test
            type=sha,prefix=test-

      # No QEMU: the app is built once on the runner's own architecture, and
      # the final stage only copies files (see docker/Dockerfile).
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
