# ---------------------------------------------------------------------------
# Recette de construction pour F-Droid.
#
# Ce fichier n'est pas lu depuis ce dépôt : il se recopie dans `fdroiddata`,
# sous `metadata/org.osmlocal.plans.yml`, au moment de la demande d'inclusion
# (une issue sur gitlab.com/fdroid/rfp, puis une merge request sur fdroiddata).
# Il est gardé ici pour vivre avec la chaîne de build qu'il décrit : changer
# `apk/package.json` sans changer ce fichier, c'est casser la construction chez
# eux sans s'en apercevoir.
#
# ⚠ JAMAIS EXÉCUTÉE. L'ordre des étapes a été vérifié dans le code de
# fdroidserver 2.4.5 et le fichier passe `fdroid lint`, mais la construction
# elle-même n'a pas tourné sur leur image : c'est la CI de la merge request sur
# fdroiddata qui la fera la première.
# ---------------------------------------------------------------------------

Categories:
  - Navigation
  - Public Transport
License: GPL-3.0-or-later
AuthorName: Gris-S
SourceCode: https://github.com/Gris-S/my-osm
IssueTracker: https://github.com/Gris-S/my-osm/issues
Changelog: https://github.com/Gris-S/my-osm/releases

AutoName: MY OSM

RepoType: git
Repo: https://github.com/Gris-S/my-osm.git

# Builds reproductibles, signature du développeur (choix du 17 septembre 2026) :
# F-Droid reconstruit l'APK, le compare octet pour octet à celui de la release
# GitHub et, s'ils sont identiques, publie **celui-ci**, signé par nous. Les
# mises à jour passent alors d'une source à l'autre sans désinstaller. Une
# version qui ne se reproduit pas est **sautée** par F-Droid, pas signée par eux.
# L'asset de la release doit donc s'appeler exactement `MY-OSM-<version>.apk`.
# Vérifié pour 0.1.0-alpha.26 avec `common.verify_apks` de fdroidserver : l'APK
# d'un clone propre (signé de la clé de débogage, faute de la nôtre) correspond
# à celui de la release.
Binaries: https://github.com/Gris-S/my-osm/releases/download/v%v/MY-OSM-%v.apk

Builds:
  - versionName: 0.1.0-alpha.26
    versionCode: 1000026
    # Le dépôt préfixe ses tags d'un « v » (v0.1.0-alpha.16 est le premier
    # publié). `commit:` doit reprendre le **nom exact du tag**, sans quoi le
    # serveur de F-Droid ne trouve rien à construire.
    commit: v0.1.0-alpha.26

    # Gradle est lancé par F-Droid depuis ce dossier ; tout ce qui précède est
    # à notre charge. Les étapes de `build:` en partent aussi, d'où le
    # `cd ../../..` qui remonte à la racine du dépôt.
    subdir: apk/android/app

    # Node n'est pas sur l'image de construction. Version épinglée **avec son
    # empreinte** : sans elle, la recette ferait confiance à un téléchargement.
    sudo:
      - curl -Lo node.tar.xz https://nodejs.org/dist/v26.8.1/node-v26.8.1-linux-x64.tar.xz
      - echo "3e301118d7df53d563b7e96c1617545f26e2f76f9724be668d6cab65c15dda5d  node.tar.xz" | sha256sum -c -
      - tar xJf node.tar.xz
      - cp -a node-v26.8.1-linux-x64/. /usr/local/
    gradle:
      - yes

    # Tout se fait dans `build:`, rien dans `init:`. Ce que fait le serveur,
    # d'après fdroidserver 2.4.5 (build.py, common.py) :
    #   - `init:` tourne dans `subdir`, puis le scanner passe et **supprime**
    #     les chemins de `scandelete`, puis `build:` tourne. Des `npm ci` en
    #     `init:` avec `node_modules` en `scandelete` : Gradle ne trouvait plus
    #     le code Android de Capacitor (apk/node_modules/@capacitor/android).
    #     Installées en `build:`, les dépendances arrivent après le scanner.
    #   - Les lignes de `build:` sont jointes par « ; » dans **un seul** bash :
    #     un `cd` vaut pour les lignes suivantes. D'où un seul `cd` en tête,
    #     depuis `subdir` jusqu'à la racine du dépôt.
    #
    # `npm ci` et non `npm install` : les deux verrous sont versionnés, et la
    # construction doit être reproductible.
    #
    # Le script d'`apk/` qui posait l'APK sur un téléphone s'appelait `install`,
    # un nom que npm exécute tout seul pendant `npm ci` : il lançait `adb` et
    # faisait échouer l'installation sur une machine sans téléphone. Renommé
    # `install-apk` — ne jamais réintroduire un script portant un nom réservé.
    #
    # `MYOSM_DIAGNOSTICS=0` retire l'objet de diagnostic `window.__myosm` et
    # rend le journal de navigation inerte. Aucune clé d'API n'est passée : il
    # n'y a pas de `.env.local` dans un clone, et `vite.config.ts` **refuse de
    # construire** une version de partage si une clé traînait dans
    # l'environnement. Les clés se saisissent dans l'application.
    #
    # Pas de `scandelete` : `node_modules` n'existe pas encore quand le scanner
    # passe, et un chemin qui ne correspond à rien est une erreur pour lui.
    build:
      - cd ../../..
      - npm --prefix app ci
      - npm --prefix apk ci
      - OSM_TARGET=apk MYOSM_DIAGNOSTICS=0 npm --prefix app run build
      - cd apk && npx cap sync android

# Empreinte SHA-256 du certificat de release, en minuscules et sans « : ».
AllowedAPKSigningKeys: 0537bb84f0222e9e6892e06c478be29bcf0b95bb93ffc92e1cc48e518cada2c9

# Le numéro de version est déduit de `app/package.json` par
# `apk/android/app/build.gradle` : 0.1.0-alpha.26 -> 1000026. Une version
# finale passe devant toutes ses alphas (suffixe 9999).
AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: 0.1.0-alpha.26
CurrentVersionCode: 1000026
