# ---------------------------------------------------------------------------
# Recette de construction pour F-Droid.
#
# Ce fichier n'est pas lu depuis ce dépôt : il se recopie dans `fdroiddata`,
# sous `metadata/org.osmlocal.plans.yml`, au moment de la demande d'inclusion
# (merge request fdroiddata !49227, ouverte le 17 septembre 2026).
# Il est gardé ici pour vivre avec la chaîne de build qu'il décrit : changer
# `apk/package.json` sans changer ce fichier, c'est casser la construction chez
# eux sans s'en apercevoir.
#
# Vérifiée hors de leur serveur, avec fdroidserver 2.4.5 : `fdroid lint`,
# `rewritemeta`, le schéma de fdroiddata, `checkupdates`, le scanner, puis les
# étapes rejouées avec Node 24.20 sur un clone du commit, jusqu'à un APK que
# `common.verify_apks` reconnaît identique à celui de la release. La première
# tentative sur leur CI a échoué sur trois points, corrigés depuis : `xz`
# absent de l'image, `AutoUpdateMode: Version v%v` refusé par le schéma, et
# `commit:` qui doit être un identifiant de commit. La deuxième (0.1.0-alpha.27)
# sur deux autres : le Node de Debian ne lit pas `capacitor.config.ts` (passé en
# JSON), et F-Droid retire le bloc `signingConfigs` de `build.gradle` sans les
# lignes qui s'y réfèrent (lues désormais par `findByName`). La troisième
# (0.1.0-alpha.28) a construit et **reproduit** l'APK sur leur serveur, mais
# refusé celui de la release : Gradle y glissait un bloc « Dependency
# metadata », chiffré pour Google Play (`dependenciesInfo` coupé depuis
# 0.1.0-alpha.30). Depuis 0.1.0-alpha.28, le vrai `fdroid build`
# (fdroidserver master, comme leur CI) tourne ici jusqu'à l'APK, et
# `verify_apks` le reconnaît identique à la release signée ; depuis
# 0.1.0-alpha.30, `fdroid scanner` passe aussi sur l'APK de la release.
#
# 0.1.0-alpha.54 ne change rien à la chaîne de construction décrite ici, et
# n'a **pas** été repassée au `fdroid build` local : la reproductibilité de la
# release vaut donc jusqu'à 0.1.0-alpha.30 comprise. Si elle ne se reproduisait
# pas chez eux, F-Droid sauterait la version au lieu de la signer lui-même.
#
# `rewritemeta` retire ces commentaires : c'est **sa** sortie qui part dans
# fdroiddata.
# ---------------------------------------------------------------------------

# Avertissements, au niveau de l'application (demande du mainteneur) :
# TetheredNet (instances fixes) et NonFreeNet (imagerie Esri hors de France,
# chargée sans clé ; services optionnels à clé).
AntiFeatures:
  NonFreeNet:
    en-US: Esri imagery abroad; optional TomTom, Mapillary, PRIM, Météo-France
  TetheredNet:
    en-US: OpenFreeMap, Photon, Nominatim, OSRM, Overpass and Transitous
Categories:
  - Navigation
  - Public Transport
License: GPL-3.0-or-later
AuthorName: Gris-S
SourceCode: https://github.com/Gris-S/my-osm
IssueTracker: https://github.com/Gris-S/my-osm/issues
Changelog: https://github.com/Gris-S/my-osm/releases

AutoName: MY OSM

RepoType: git
Repo: https://github.com/Gris-S/my-osm.git

# Builds reproductibles, signature du développeur (choix du 17 septembre 2026) :
# F-Droid reconstruit l'APK, le compare octet pour octet à celui de la release
# GitHub et, s'ils sont identiques, publie **celui-ci**, signé par nous. Les
# mises à jour passent alors d'une source à l'autre sans désinstaller. Une
# version qui ne se reproduit pas est **sautée** par F-Droid, pas signée par eux.
# L'asset de la release doit donc s'appeler exactement `MY-OSM-<version>.apk`.
# Vérifié pour 0.1.0-alpha.30 avec `common.verify_apks` de fdroidserver : l'APK
# d'un clone propre (signé de la clé de débogage, faute de la nôtre) correspond
# à celui de la release.
Binaries: https://github.com/Gris-S/my-osm/releases/download/v%v/MY-OSM-%v.apk

Builds:
  - versionName: 0.1.0-alpha.54
    versionCode: 1000054
    # L'identifiant **complet** du commit du tag v0.1.0-alpha.54, pas le tag :
    # un tag se déplace, un commit non (demande du mainteneur, !49227).
    commit: 474b107e94f12b9d995039134537ee63219942d9

    # Gradle est lancé par F-Droid depuis ce dossier ; tout ce qui précède est
    # à notre charge. `prebuild:` et `build:` en partent aussi, d'où le
    # `cd ../../..` qui remonte à la racine du dépôt.
    subdir: apk/android/app

    # Node vient de Debian, comme le demande F-Droid, mais de **forky** :
    # trixie n'a que Node 20, et le CLI de Capacitor 8 refuse de tourner sous
    # 22 (« The Capacitor CLI requires NodeJS >=22.0.0 », mesuré). Forky donne
    # Node 24. Le Node de Debian ne lit pas le TypeScript : la configuration
    # Capacitor est donc en JSON depuis 0.1.0-alpha.30. Construit dans un
    # conteneur Debian avec ce Node, l'APK est identique, octet pour octet, à
    # celui de la release (construit avec Node 26). Même méthode que
    # les recettes d'io.github.nyxar77.pulse et de jp.nonbili.noutube.
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky npm
    gradle:
      - yes

    # Ordre réel chez F-Droid (fdroidserver 2.4.5, build.py et common.py) :
    # `prebuild:` dans `subdir`, puis le scanner, puis `build:`. Chaque liste est
    # jointe par « ; » dans **un seul** bash : un `cd` vaut pour les lignes
    # suivantes. Une commande par ligne, jamais de `;` ni de `&&` (demande du
    # mainteneur, !49227).
    #
    # Les dépendances s'installent **avant** le scanner, pour qu'il les examine.
    # `npm ci` et non `npm install` : les deux verrous sont versionnés.
    #
    # Le script d'`apk/` qui posait l'APK sur un téléphone s'appelait `install`,
    # un nom que npm exécute tout seul pendant `npm ci` : il lançait `adb` et
    # faisait échouer l'installation sur une machine sans téléphone. Renommé
    # `install-apk` — ne jamais réintroduire un script portant un nom réservé.
    prebuild:
      - cd ../../..
      - npm --prefix app ci
      - npm --prefix apk ci

    # Ce que le scanner relève dans les dépendances (13 fichiers, mesuré) : rien
    # de tout cela n'entre dans l'APK ni ne sert à le construire, sauf l'archive
    # que `cap sync android` décompresse — gardée, comme chez Pulse.
    # `scandelete` ne retire que les fichiers signalés sous ces chemins.
    scanignore:
      - apk/node_modules/@capacitor/cli/assets/capacitor-cordova-android-plugins.tar.gz
    scandelete:
      - app/node_modules/three/examples
      - app/node_modules/source-map/lib/mappings.wasm
      - app/node_modules/long/dist/long.min.js.gz
      - apk/node_modules/@capacitor/cli/assets

    # `MYOSM_DIAGNOSTICS=0` retire l'objet de diagnostic `window.__myosm` et
    # rend le journal de navigation inerte. Aucune clé d'API n'est passée : il
    # n'y a pas de `.env.local` dans un clone, et `vite.config.ts` **refuse de
    # construire** une version de partage si une clé traînait dans
    # l'environnement. Les clés se saisissent dans l'application.
    build:
      - cd ../../..
      - OSM_TARGET=apk MYOSM_DIAGNOSTICS=0 npm --prefix app run build
      - cd apk
      - npx cap sync android

# Empreinte SHA-256 du certificat de release, en minuscules et sans « : ».
AllowedAPKSigningKeys: 0537bb84f0222e9e6892e06c478be29bcf0b95bb93ffc92e1cc48e518cada2c9

# `checkupdates` ne sait pas lire la version : `build.gradle` la **calcule**
# depuis `app/package.json` (0.1.0-alpha.N -> 1000000 + N). On la lui donne
# donc à lire dans `app/package.json`, et le code se recalcule de même.
# ⚠ Ne vaut que pour 0.1.0-alpha.N. Au passage en 0.1.1, 0.2.0 ou en version
# finale, la regex ne trouvera plus rien et F-Droid cessera de voir les
# nouvelles versions : adapter ces deux champs (merge request sur fdroiddata).
AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]
UpdateCheckData: 'app/package.json|"version":\s*"0\.1\.0-alpha\.(\d+)"|app/package.json|"version":\s*"([^"]+)"'
VercodeOperation:
  - 1000000 + %c
CurrentVersion: 0.1.0-alpha.54
CurrentVersionCode: 1000054
