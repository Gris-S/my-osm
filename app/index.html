<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Un PNG et non un SVG : l'icône est désormais une image fournie, qui
         n'a pas de forme vectorielle. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Écran d'accueil iOS : la même image, aplatie sur du blanc — ce système
         n'accepte pas la transparence — et pleine bord, car il applique son
         propre masque. Générée par `npm run build:icons`, comme le favicon
         ci-dessus et les deux icônes du manifeste. Elle sert telle quelle au
         packaging APK. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Couleur de la barre du navigateur : le fond de carte clair, le
         charcoal du mode sombre. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f2ed" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1c1e" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Carte locale basée sur OpenStreetMap : commerces, horaires, itinéraires." />
    <title>MY OSM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
