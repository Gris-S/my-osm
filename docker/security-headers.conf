# En-têtes de sécurité, inclus dans chaque `location` qui sert l'application.
#
# nginx n'hérite pas des `add_header` d'un niveau supérieur dès qu'un bloc en
# déclare un lui-même : d'où ce fichier, inclus partout plutôt que posé une
# fois au niveau du serveur.
#
# La politique de contenu est celle de `app/src/security.ts`, que l'application
# pose aussi elle-même au démarrage. La répéter en en-tête ajoute ce qu'une
# balise <meta> ne peut pas dire : `frame-ancestors`, qui interdit d'afficher
# l'application dans le cadre d'un autre site. Les deux doivent rester
# d'accord : une règle changée dans `security.ts` se change ici.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'self' https: data: blob:; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' https: data:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Position et capteurs de mouvement (boussole, podomètre) pour l'application
# elle-même ; rien d'autre.
add_header Permissions-Policy "geolocation=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self), camera=(), microphone=(), payment=(), usb=()" always;
