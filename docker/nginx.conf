# ---------------------------------------------------------------------------
# nginx de l'image Docker de MY OSM.
#
# Le processus tourne sans privilèges (utilisateur 101 de l'image
# nginx-unprivileged) et le système de fichiers est en lecture seule : tout ce
# qui s'écrit va dans /tmp, un tmpfs (voir compose.yaml). La configuration du
# site est engendrée au démarrage depuis `myosm.conf.template`, pour y mettre
# les résolveurs DNS du conteneur (voir ce fichier).
# ---------------------------------------------------------------------------

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    # Absents du `mime.types` de l'image : le manifeste de l'application web et
    # le worker de MapLibre (`maplibre-gl-worker.mjs`), qu'un navigateur refuse
    # d'exécuter s'il n'est pas servi comme du JavaScript.
    types {
        application/manifest+json webmanifest;
        text/javascript           mjs;
    }
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript text/javascript application/json application/manifest+json;

    access_log /var/log/nginx/access.log combined;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    # Ni version dans les en-têtes ni dans les pages d'erreur.
    server_tokens off;
    # L'application n'envoie rien au serveur : aucun corps de requête accepté.
    client_max_body_size 1k;

    # Les fichiers sont compressés à la construction (`.gz` à côté de chaque
    # fichier texte) : nginx les sert tels quels, sans recompresser à chaque
    # requête. `gzip on` ne sert qu'à ce qui n'a pas de version compressée.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript text/javascript application/json application/manifest+json image/svg+xml;

    # Le relais du trafic (Bison Futé) : dix requêtes par minute et par adresse
    # suffisent largement — l'application le relit toutes les trois minutes —,
    # et la réponse est gardée trois minutes pour tout le monde.
    limit_req_zone $binary_remote_addr zone=relay:1m rate=10r/m;
    limit_req_status 429;
    proxy_cache_path /tmp/relay-cache levels=1 keys_zone=relay_cache:1m max_size=32m inactive=10m use_temp_path=off;

    include /tmp/myosm.conf;
}
