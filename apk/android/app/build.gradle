apply plugin: 'com.android.application'

// La version vient de l'application web (`app/package.json`), seule source :
// `0.1.0-alpha.N` pendant l'alpha. Le code de version doit monter à chaque
// livraison ; il se déduit du numéro : 0.1.0-alpha.3 -> 1000003.
def appVersion = new groovy.json.JsonSlurper().parse(file('../../../app/package.json')).version
def appVersionCode = { String v ->
    def m = (v =~ /^(\d+)\.(\d+)\.(\d+)(?:-alpha\.(\d+))?/)
    if (!m.find()) return 1
    def base = ((m.group(1) as int) * 100 + (m.group(2) as int)) * 100 + (m.group(3) as int)
    // Une version finale passe devant toutes ses alphas.
    return base * 10000 + (m.group(4) != null ? (m.group(4) as int) : 9999)
}(appVersion)

android {
    namespace = "org.osmlocal.plans"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "org.osmlocal.plans"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Clé de signature de la version à partager.
    //
    // **La clé de débogage d'Android est publique et identique sur toutes les
    // machines** : un APK signé avec elle peut être remplacé par une mise à jour
    // que n'importe qui aura forgée. C'est éliminatoire pour une publication
    // (F-Droid, une release GitHub), et ça l'était pour `livrables/MY-OSM.apk`.
    //
    // La vraie clé ne vit pas dans le dépôt : elle vient de l'environnement, ou
    // de `~/.gradle/gradle.properties`. Sans elle, on retombe sur la clé de
    // débogage — pour qu'un build de travail continue de passer — mais en le
    // disant à voix haute (voir l'avertissement plus bas).
    //
    //   export MYOSM_KEYSTORE=~/.clefs/my-osm.jks
    //   export MYOSM_KEYSTORE_PASSWORD=…  MYOSM_KEY_ALIAS=…  MYOSM_KEY_PASSWORD=…
    signingConfigs {
        release {
            def keystorePath = System.getenv("MYOSM_KEYSTORE") ?: project.findProperty("myosmKeystore")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("MYOSM_KEYSTORE_PASSWORD") ?: project.findProperty("myosmKeystorePassword")
                keyAlias System.getenv("MYOSM_KEY_ALIAS") ?: project.findProperty("myosmKeyAlias")
                keyPassword System.getenv("MYOSM_KEY_PASSWORD") ?: project.findProperty("myosmKeyPassword")
            }
        }
    }

    buildTypes {
        release {
            // Version à partager : non débogable (ni `run-as`, ni débogage de la
            // WebView, que Capacitor suit sur ce drapeau).
            def signedForRelease = signingConfigs.release.storeFile != null
            signingConfig signedForRelease ? signingConfigs.release : signingConfigs.debug
            if (!signedForRelease) {
                logger.warn(
                    "MY OSM : aucune clé de release (MYOSM_KEYSTORE). L'APK est signé avec la clé de " +
                    "débogage, publique : bon pour essayer sur son propre téléphone, à ne pas publier."
                )
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
